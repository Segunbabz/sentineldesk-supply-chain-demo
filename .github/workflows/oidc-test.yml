name: OIDC test

# Run when I click "Run workflow" in the Actions tab, and on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# These permissions apply to the whole workflow.
permissions:
  id-token: write   # lets the job ask GitHub for an OIDC token (the "ID badge")
  contents: read    # lets the job read the repo's files

jobs:
  aws-login-test:
    runs-on: ubuntu-latest   # a temporary GitHub-hosted Linux machine
    steps:
          # DEBUG ONLY: print the claims GitHub puts in the login token
      - name: Show OIDC token claims
        run: |
          # Ask GitHub for a token meant for AWS (the URL and token below are supplied by GitHub automatically)
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          # A token has 3 parts separated by dots. Take the middle part (the claims), decode it, and show only the useful fields
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0)%4) $0=$0"="; print }' | base64 -d | jq '{sub, aud, iss, repository, ref}'      # Step 1: swap GitHub's token for short-lived AWS credentials
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::471960167858:role/sentineldesk-gha-oidc-role
          aws-region: ca-central-1

      # Step 2: ask AWS "who am I?" to prove the login worked
      - name: Show who AWS thinks I am
        run: aws sts get-caller-identity
